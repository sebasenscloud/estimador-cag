[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.108.0",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.0",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
